name: "Open WebUI (port 8081)"
description: "Open WebUI exposed on host port 8081 without host networking"
version: "0.11.0-1"
slug: "openwebui8081"
url: https://github.com/UrbanErosion/openwebui-ha-port
panel_icon: mdi:message
init: false

arch:
  - aarch64
  - amd64
startup: services
webui: "http://[HOST]:[PORT:8080]"
host_network: false
ports:
  8080/tcp: 8081
ports_description:
  8080/tcp: "Open WebUI Web Interface"
map:
  - share
image: ghcr.io/mikastamm/open-webui-homeassistant-addon
